name: Add finished sessions

# Checks OpenF1 for newly finished practice, qualifying, sprint and race sessions
# and commits their replay data to data/. Your host redeploys from the new commit.
on:
  schedule:
    # every 10 minutes, Friday to Monday (UTC), which covers every race weekend in every time zone.
    # New sessions usually appear 30-45 minutes after they end: OpenF1 opens free access about 30 minutes after a session.
    - cron: "*/10 * * * 5,6,0,1"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-sessions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch finished sessions from OpenF1
        run: python3 scripts/update_sessions.py

      - name: Rebuild search pages if there is new data
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            python3 scripts/build_pages.py
          fi

      - name: Commit new replay data and pages
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "No new sessions."
            exit 0
          fi
          git config user.name "pitwall-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data races drivers teams formula-1-standings-2026 f1-calendar-2026 sitemap.xml
          git commit -m "Add replay data and pages for newly finished sessions"
          git push
