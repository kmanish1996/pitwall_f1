name: Add finished sessions

# Checks OpenF1 for newly finished practice, qualifying, sprint and race sessions
# and commits their replay data to data/. Your host redeploys from the new commit.
on:
  schedule:
    # every 30 minutes, Friday to Monday (UTC), which covers every race weekend in every time zone
    - cron: "7,37 * * * 5,6,0,1"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-sessions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch finished sessions from OpenF1
        run: python3 scripts/update_sessions.py

      - name: Commit new replay data
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "No new sessions."
            exit 0
          fi
          git config user.name "pitwall-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Add replay data for newly finished sessions"
          git push
