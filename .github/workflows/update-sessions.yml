name: Add finished sessions

# Watches OpenF1 through each race weekend and publishes every finished session (practice, qualifying,
# sprint, race) about 20-40 minutes after it ends: replay data, standings, race story, share image,
# sitemap, then an IndexNow ping. scripts/watch_sessions.py does the work.
#
# GitHub starts scheduled runs late (every 4-7 hours in practice), so one check per run left results
# hours behind. Now each run keeps watching while a session is due or coming within 30 hours, and just
# before its time limit it starts a fresh run of this workflow, so coverage is continuous. The repo is
# public, so the runner time is free. Thursday is included so the watch is already running for Friday.
on:
  schedule:
    - cron: "*/30 * * * 4,5,6,0,1"
  workflow_dispatch: {}

permissions:
  contents: write   # commit data and pages
  actions: write    # start the next watch run

concurrency:
  group: update-sessions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Pillow (draws each page's share image)
        run: pip install --quiet pillow

      - name: Watch OpenF1 and publish finished sessions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/watch_sessions.py
